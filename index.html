<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danni Accesories</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F0EBE5;
            color: #03086C;
            text-align: center;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: auto;
            padding: 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .logo {
            width: 110px;
            margin: 10px auto 25px;
        }

        .link {
            display: block;
            margin: 10px 0;
            padding: 16px;
            width: 100%;
            background: #03086C;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 18px;
            font-weight: bold;
            font-size: 16px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .link:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            font-size: 12px;
            opacity: 0.6;
            padding: 15px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="logo.png" class="logo">

        <a class="link" href="#">Instagram</a>
        <a class="link" href="#">Facebook</a>
        <a class="link" href="#">Whatsapp</a>

    </div>

    <div class="footer">© 2026 Danni Accessories</div>

</body>
</html>
