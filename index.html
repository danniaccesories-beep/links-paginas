<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danni Accessories</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F0EBE5;
            color: #03086C;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* LOGO */
        .logo {
            width: 120px;
            margin-bottom: 40px;
        }

        /* CONTENEDOR BOTONES */
        .links {
            width: 100%;
            max-width: 350px;
        }

        /* BOTONES */
        .link {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 18px;
            background: #03086C;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;

            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: 0.2s;
        }

        .link:active {
            transform: scale(0.97);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            font-size: 12px;
            opacity: 0.6;
            padding: 20px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="logo.png" alt="Danni Accessories" class="logo">

        <div class="links">
            <a class="link" href="https://www.instagram.com/danni_accesories" target="_blank">📸 Instagram</a>
            <a class="link" href="https://www.facebook.com/share/1DhGVccXuK/" target="_blank">🔵 Facebook</a>
            <a class="link" href="https://wa.me/message/LF4OAMSEG4P5P1" target="_blank">🟢 WhatsApp</a>
        </div>

    </div>

    <div class="footer">© 2026 Danni Accessories</div>

</body>
</html>
