<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danni Accessories</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F0EBE5;
            color: #03086C;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            text-align: center;
            flex: 1;
        }

        .logo {
            width: 110px;
            margin: 20px auto 30px;
            display: block;
        }

        .link {
            display: block;
            margin: 12px 0;
            padding: 16px;
            width: 100%;
            background: #03086C;
            color: white;
            text-decoration: none;
            border-radius: 18px;
            font-weight: bold;
            font-size: 16px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .link:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            font-size: 12px;
            opacity: 0.6;
            padding: 15px 0;
        }

        /* 📱 Ajustes móviles */
        @media (max-width: 480px) {
            .logo {
                width: 95px;
            }

            .link {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="logo.png" alt="Danni Accessories" class="logo">

        <a class="link" href="https://www.instagram.com/danni_accesories" target="_blank">📸 Instagram</a>
        <a class="link" href="https://www.facebook.com/share/1DhGVccXuK/" target="_blank">🔵 Facebook</a>
        <a class="link" href="https://wa.me/message/LF4OAMSEG4P5P1" target="_blank">🟢 WhatsApp</a>

    </div>

    <div class="footer">© 2026 Danni Accessories</div>

</body>
</html>
