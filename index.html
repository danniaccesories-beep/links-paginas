   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Danni Accesories</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F0EBE5;
            color: #03086C;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
        }

        .logo {
            width: 200px;
            margin-bottom: 20px;
            opacity: 0.95;
        }

        /* QR */
        .qr-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .qr-item {
            text-align: center;
        }

        .qr-item img {
            width: 110px;
            border-radius: 10px;
        }

        .qr-item p {
            margin-top: 8px;
            font-size: 14px;
        }

        /* Links */
        .link {
            display: block;
            margin: 12px auto;
            padding: 18px;
            width: 85%;
            max-width: 320px;
            background: #03086C;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
            font-weight: bold;
            font-size: 16px;
        }

        .link:hover {
            background: #050bb5;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Logo -->
        <img src="logo.png" alt="Danni Accessories" class="logo">

        <!-- QRs -->
        <div class="qr-container">
            <div class="qr-item">
                <img src="qr-instagram.png" alt="Instagram">
                <p>Instagram</p>
            </div>

            <div class="qr-item">
                <img src="qr-facebook.png" alt="Facebook">
                <p>Facebook</p>
            </div>

            <div class="qr-item">
                <img src="qr-whatsapp.png" alt="WhatsApp">
                <p>WhatsApp</p>
            </div>
        </div>

        <!-- Links -->
        <a class="link" href="https://instagram.com/tu_usuario" target="_blank">📸 Instagram</a>
        <a class="link" href="https://facebook.com/tu_usuario" target="_blank">🔵 Facebook</a>
        <a class="link" href="https://wa.me/57TU_NUMERO" target="_blank">🟢 WhatsApp</a>

        <!-- Footer -->
        <div class="footer">© 2026 Danni Accessories</div>

</body>
</html>
